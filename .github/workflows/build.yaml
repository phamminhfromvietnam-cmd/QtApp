name: Build Qt Windows Release

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Configure & Build
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Bundle DLLs with windeployqt
        run: |
          mkdir release
          copy build\QtApplication.exe release\
          windeployqt --release --no-translations release\QtApplication.exe

      - name: Create Single-File SFX Executable
        shell: pwsh
        run: |
          # 1. Create the silent-installer config file
          $configContent = @"
          ;!@Install@!UTF-8!
          Title="Qt Application"
          RunProgram="QtApplication.exe"
          ;!@InstallEnd@!
          "@
          Set-Content -Path "sfx_config.txt" -Value $configContent -Encoding utf8

          # 2. Dynamically fetch the latest 7-Zip extra package link to prevent 404 errors
          $html = (Invoke-WebRequest -Uri "https://www.7-zip.org/download.html" -UseBasicParsing).Content
          if ($html -match 'href="(a/7z\d+-extra\.7z)"') {
              $sfxUrl = "https://www.7-zip.org/" + $Matches[1]
          } else {
              # Fallback to a known stable direct link if scraping fails
              $sfxUrl = "https://www.7-zip.org/a/7z2409-extra.7z"
          }
          
          Write-Host "Downloading 7-Zip extra from: $sfxUrl"
          Invoke-WebRequest -Uri $sfxUrl -OutFile "7z-extra.7z"
          
          # 3. Extract the extra package containing 7zS.sfx
          & "C:\Program Files\7-Zip\7z.exe" x 7z-extra.7z -o"7z-extra" -y
          
          # 4. Create the standard 7z archive of your release folder
          cd release
          & "C:\Program Files\7-Zip\7z.exe" a -t7z ..\app.7z *
          cd ..

          # 5. Combine everything into a single zero-setup executable
          $outputExe = "QtApplication-Installer.exe"
          $fs = [System.IO.File]::Open($outputExe, [System.IO.FileMode]::Create)
          try {
              [System.IO.File]::OpenRead("7z-extra\7zS.sfx").CopyTo($fs)
              [System.IO.File]::OpenRead("sfx_config.txt").CopyTo($fs)
              [System.IO.File]::OpenRead("app.7z").CopyTo($fs)
          } finally {
              $fs.Dispose()
          }

      - name: Upload Single-File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-single-file-app
          path: QtApplication-Installer.exe
