name: Build Qt Windows Release

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0' # Match your Qt version
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Configure & Build
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Bundle DLLs with windeployqt
        run: |
          mkdir release
          copy build\YourAppName.exe release\
          windeployqt --release --no-translations release\YourAppName.exe

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: YourApp-Windows-x64
          path: release/
