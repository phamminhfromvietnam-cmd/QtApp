name: Build Qt Windows Release

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Configure & Build
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Bundle DLLs with windeployqt
        run: |
          mkdir release
          copy build\QtApplication.exe release\
          windeployqt --release --no-translations release\QtApplication.exe

      - name: Create Single-File SFX Executable
        shell: pwsh
        run: |
          # 1. Create the silent-installer config file using a here-string
          $configContent = @"
          ;!@Install@!UTF-8!
          Title="Qt Application"
          RunProgram="QtApplication.exe"
          ;!@InstallEnd@!
          "@
          Set-Content -Path "sfx_config.txt" -Value $configContent -Encoding utf8

          # 2. Download the 7-Zip extra package from GitHub's reliable release CDN
          $sfxUrl = "https://github.com/ip7z/7zip/releases/download/24.09/7z2409-extra.7z"
          Write-Host "Downloading from GitHub CDN: $sfxUrl"
          Invoke-WebRequest -Uri $sfxUrl -OutFile "7z-extra.7z"
          
          # 3. Extract the extra package containing the 7zS.sfx installer module
          & "C:\Program Files\7-Zip\7z.exe" x 7z-extra.7z -o"7z-extra" -y
          
          # 4. Create a standard 7z archive of your release folder
          cd release
          & "C:\Program Files\7-Zip\7z.exe" a -t7z ..\app.7z *
          cd ..

          # 5. Combine the modules safely using .NET file streams into a zero-setup executable
          $outputExe = "QtApplication-Installer.exe"
          $fs = [System.IO.File]::Open($outputExe, [System.IO.FileMode]::Create)
          try {
              [System.IO.File]::OpenRead("7z-extra\7zS.sfx").CopyTo($fs)
              [System.IO.File]::OpenRead("sfx_config.txt").CopyTo($fs)
              [System.IO.File]::OpenRead("app.7z").CopyTo($fs)
          } finally {
              $fs.Dispose()
          }

      - name: Upload Single-File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-single-file-app
          path: QtApplication-Installer.exe
