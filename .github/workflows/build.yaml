name: Build Qt Windows Release

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Configure & Build
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Bundle DLLs with windeployqt
        shell: pwsh
        run: |
          # Dynamically locate the compiled executable in the build folder
          $builtExe = (Get-ChildItem -Path "build" -Filter "*.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $builtExe) { throw "Could not find any compiled executable in build directory." }
          
          $exeName = [System.IO.Path]::GetFileName($builtExe)
          Write-Host "Found executable to deploy: $exeName"

          # Create release directory and copy main binary
          $releaseDir = "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Path $builtExe -Destination $releaseDir\

          # Run windeployqt dynamically against the discovered executable
          windeployqt --release --no-translations "$releaseDir\$exeName"

      - name: Create Single-File SFX Executable
        shell: pwsh
        run: |
          # Dynamic project variables
          $releaseDir = "release"
          $archiveName = "app.7z"
          $outputExe = "QtApplication-Installer.exe"

          # Auto-detect the primary executable inside the release folder
          $targetExe = (Get-ChildItem -Path $releaseDir -Filter "*.exe" | Select-Object -First 1).Name
          if (-not $targetExe) { throw "No executable found in release folder for deployment." }
          Write-Host "Target executable for SFX run: $targetExe"

          # 1. Dynamically generate the silent-installer config file
          $configContent = @"
          ;!@Install@!UTF-8!
          Title="Qt Application"
          RunProgram="$targetExe"
          ;!@InstallEnd@!
          "@
          Set-Content -Path "sfx_config.txt" -Value $configContent -Encoding utf8

          # 2. Download the 7-Zip extra package from GitHub's reliable release CDN
          $sfxUrl = "https://github.com/ip7z/7zip/releases/download/24.09/7z2409-extra.7z"
          Write-Host "Downloading extra package from: $sfxUrl"
          Invoke-WebRequest -Uri $sfxUrl -OutFile "7z-extra.7z"
          
          # 3. Locate 7-Zip executable dynamically on the runner system
          $sevenZipExe = (Get-Command "7z" -ErrorAction SilentlyContinue).Source
          if (-not $sevenZipExe) {
              $sevenZipExe = "C:\Program Files\7-Zip\7z.exe"
          }
          if (-not (Test-Path $sevenZipExe)) {
              throw "7-Zip executable could not be located on the runner."
          }

          # Extract the extra package using the dynamic 7-Zip path
          & $sevenZipExe x "7z-extra.7z" -o"7z-extra" -y
          
          # Dynamically locate 7zS.sfx wherever it lands within the extracted tree
          $sfxModule = (Get-ChildItem -Path "7z-extra" -Filter "7zS.sfx" -Recurse).FullName
          if (-not $sfxModule) {
              throw "Could not find 7zS.sfx inside the extracted files."
          }
          Write-Host "Found SFX module at: $sfxModule"

          # 4. Create a standard 7z archive of your dynamic release folder
          Push-Location $releaseDir
          & $sevenZipExe a -t7z "..\$archiveName" "*"
          Pop-Location

          # 5. Combine the modules dynamically using robust .NET file streams
          Write-Host "Assembling final single-file executable: $outputExe"
          $fs = [System.IO.File]::Open($outputExe, [System.IO.FileMode]::Create)
          try {
              [System.IO.File]::OpenRead($sfxModule).CopyTo($fs)
              [System.IO.File]::OpenRead("sfx_config.txt").CopyTo($fs)
              [System.IO.File]::OpenRead($archiveName).CopyTo($fs)
          } finally {
              $fs.Dispose()
          }

      - name: Upload Single-File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-single-file-app
          path: QtApplication-Installer.exe
