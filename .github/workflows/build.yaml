name: Build Qt Windows Release

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Configure & Build
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Bundle DLLs with windeployqt
        run: |
          mkdir release
          copy build\QtApplication.exe release\
          windeployqt --release --no-translations release\QtApplication.exe

      - name: Create Single-File SFX Executable
        shell: pwsh
        run: |
          # Create config using RunProgram so it executes automatically after background extraction
          $configContent = @"
          ;!@Install@!UTF-8!
          Title="Qt Application"
          RunProgram="QtApplication.exe"
          ;!@InstallEnd@!
          "@
          Set-Content -Path "sfx_config.txt" -Value $configContent -Encoding utf8

          # Download the official 7-Zip Extra package containing 7zS.sfx
          $sfxUrl = "https://www.7-zip.org/a/7z2606-extra.7z"
          Invoke-WebRequest -Uri $sfxUrl -OutFile "7z-extra.7z"
          
          # Extract the extra package
          & "C:\Program Files\7-Zip\7z.exe" x 7z-extra.7z -o"7z-extra" -y
          
          # Create a standard 7z archive of your release folder
          cd release
          & "C:\Program Files\7-Zip\7z.exe" a -t7z ..\app.7z *
          cd ..

          # Combine the silent-execution SFX module, config, and archive into a single final .exe
          $outputExe = "QtApplication-Installer.exe"
          $fs = [System.IO.File]::Open($outputExe, [System.IO.FileMode]::Create)
          try {
              [System.IO.File]::OpenRead("7z-extra\7zS.sfx").CopyTo($fs)
              [System.IO.File]::OpenRead("sfx_config.txt").CopyTo($fs)
              [System.IO.File]::OpenRead("app.7z").CopyTo($fs)
          } finally {
              $fs.Dispose()
          }

      - name: Upload Single-File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-single-file-app
          path: QtApplication-Installer.exe
