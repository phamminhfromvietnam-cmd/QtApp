name: Build Qt Windows Release

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Configure & Build
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Bundle DLLs with windeployqt
        shell: pwsh
        run: |
          $builtExe = (Get-ChildItem -Path "build" -Filter "*.exe" -Recurse | Select-Object -First 1).FullName
          $exeName = [System.IO.Path]::GetFileName($builtExe)
          
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Path $builtExe -Destination "$releaseDir\"

          windeployqt --release --no-translations (Join-Path $releaseDir $exeName)

      - name: Create Portable Zip Archive
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "release"
          $zipName = Join-Path $PWD "QtApplication-Portable.zip"
          
          if (Test-Path $zipName) { Remove-Item $zipName }
          
          # Compress the release folder cleanly using native PowerShell
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -Force
          
          if (Test-Path $zipName) {
              $size = (Get-Item $zipName).Length
              Write-Host "SUCCESS: Created $zipName ($size bytes)"
          } else {
              throw "Failed to create zip archive."
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-app
          path: QtApplication-Portable.zip
